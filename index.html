<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calc-body">
    <div class="display">0</div>
    <div class="actions">
        <button>Clear</button>
        <button>Del</button>
    </div>
    <div class="buttons">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operator">÷</button>
        
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operator">×</button>
        
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operator">−</button>
        
        <button class="zero">0</button>
        <button>.</button>
        <button class="operator">+</button>
        
        <button class="equals">=</button>
    </div>
</div>


    <footer>
      <p>
        &#169; <span id="year"></span> 100machi
        <img
          class="footer-img"
          src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg"
        />
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
