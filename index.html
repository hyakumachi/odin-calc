<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="calc-body">
      <div id="display">0</div>
      <div class="actions row-1">
        <button id="clear">Clear</button>
        <button id="del">Del</button>
      </div>
      <div class="buttons">
        <div class="row">
          <button data-number="7">7</button>
          <button data-number="8">8</button>
          <button data-number="9">9</button>
          <button data-operator="/" class="operator">&divide;</button>
        </div>

        <div class="row">
          <button data-number="4">4</button>
          <button data-number="5">5</button>
          <button data-number="6">6</button>
          <button data-operator="*" class="operator">&times;</button>
        </div>

        <div class="row">
          <button data-number="1">1</button>
          <button data-number="2">2</button>
          <button data-number="3">3</button>
          <button data-operator="-" class="operator">&minus;</button>
        </div>

        <div class="row">
          <button data-number="0">0</button>
          <button data-decimal=".">.</button>
          <button data-operator="+" class="operator">&plus;</button>
          <button id="equals" class="equals">&equals;</button>
        </div>
      </div>
    </div>

    <footer>
      <p>
        &#169; <span id="year"></span> 100machi
        <img
          class="footer-img"
          src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg"
        />
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
